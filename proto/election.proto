syntax = "proto3";
package raft.election.v1;

service Election {
  rpc RequestVote(VoteRequest) returns (VoteResponse);

  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message VoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message VoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  uint64 term = 1;
  // Absent for a leader's no-op entry; otherwise a JSON-encoded command.
  optional string command_json = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // On rejection: first index of conflict_term, or last index + 1 if missing.
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}
