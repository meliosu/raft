syntax = "proto3";
package raft.election.v1;

service Election {
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  // Election-only liveness signal. Replace with AppendEntries when adding logs.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message VoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}
message VoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}
message HeartbeatRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
}
message HeartbeatResponse {
  uint64 term = 1;
  bool accepted = 2;
}
